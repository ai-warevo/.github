# collect-release-assets — Collect build artifacts for GitHub Release
#
# Combines artifacts from multiple jobs into a single directory
# before creating a GitHub Release.
#
# Pattern from production workflow:
#   parallel builds → collect → checksum → release
#
# Usage:
#   - name: Collect release assets
#     uses: ai-warevo/<repo>/.github/actions/collect-release-assets@400867e7ca58ea40173dd703a4f56f96a8dc01f2
#     with:
#       version: '1.2.3'
#       output_dir: release-artifacts

name: 'Collect Release Assets'
description: 'Collect and organize build artifacts from multiple jobs for release'

inputs:
  version:
    description: 'Release version (e.g. 1.2.3)'
    required: true
  output_dir:
    description: 'Output directory for collected artifacts'
    required: false
    default: 'release-artifacts'
  include_checksums:
    description: 'Generate SHA256 checksums (default: true)'
    required: false
    default: 'true'
  github_token:
    description: 'GitHub token for artifact download'
    required: false
    default: ${{ github.token }}

outputs:
  artifact_path:
    description: 'Path to the collected artifacts directory'
    value: ${{ steps.collect.outputs.artifact_path }}
  checksum_file:
    description: 'Path to the generated checksums file'
    value: ${{ steps.checksums.outputs.checksums_file }}
  asset_count:
    description: 'Number of collected assets'
    value: ${{ steps.collect.outputs.asset_count }}

runs:
  using: 'composite'
  steps:
    - name: Create output directory
      shell: bash
      run: |
        mkdir -p "${{ inputs.output_dir }}"
        echo "Created output directory: ${{ inputs.output_dir }}"

    - name: Download artifacts from all jobs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: '*'
        path: ${{ inputs.output_dir }}
        merge-multiple: true
        github_token: ${{ inputs.github_token }}

    - name: Organize artifacts by platform
      shell: bash
      run: |
        OUT="${{ inputs.output_dir }}"
        VERSION="${{ inputs.version }}"

        # Create a structured directory
        mkdir -p "$OUT/$VERSION"

        # Move artifacts into versioned directory
        for f in "$OUT"/*; do
          [ -f "$f" ] && mv "$f" "$OUT/$VERSION/"
        done

        echo "Organized artifacts for version $VERSION"
        ls -la "$OUT/$VERSION/"

    - name: Generate checksums
      id: checksums
      if: inputs.include_checksums == 'true'
      uses: ai-warevo/.github/.github/actions/checksums@main
      with:
        artifacts_dir: "${{ inputs.output_dir }}/${{ inputs.version }}"
        checksums_file: "${{ inputs.output_dir }}/SHA256SUMS.txt"

    - name: Summary
      id: collect
      shell: bash
      run: |
        OUT="${{ inputs.output_dir }}"
        ARTIFACT_DIR="$OUT/${{ inputs.version }}"

        if [ -d "$ARTIFACT_DIR" ]; then
          COUNT=$(find "$ARTIFACT_DIR" -type f | wc -l)
        else
          COUNT=0
        fi

        echo "artifact_path=${{ inputs.output_dir }}" >> $GITHUB_OUTPUT
        echo "asset_count=$COUNT" >> $GITHUB_OUTPUT
        echo "Collected $COUNT assets for version ${{ inputs.version }}"
