name: 'SVG Badge Generator'
description: 'Generates custom SVG badges'
inputs:
  width:
    description: 'Total SVG width'
    required: false
    default: '120'
  height:
    description: 'SVG height'
    required: false
    default: '20'
  text_left:
    description: 'Text on the left half'
    required: false
    default: 'coverage'
  text_right:
    description: 'Text on the right half'
    required: false
    default: '80%'
  bg_color_left:
    description: 'Left part color'
    required: false
    default: '#555'
  bg_color_right:
    description: 'Right part color'
    required: false
    default: '#44cc11'
  text_color:
    description: 'Text color'
    required: false
    default: '#fff'
  filename:
    description: 'Output filename'
    required: false
    default: 'badge.svg'

outputs:
  badge_path:
    description: 'Path to the created file'
    value: ${{ steps.generate.outputs.filepath }}

runs:
  using: 'composite'
  steps:
    - name: Generate SVG
      id: generate
      shell: bash
      env:
        WIDTH: ${{ inputs.width }}
        HEIGHT: ${{ inputs.height }}
        TEXT_LEFT: ${{ inputs.text_left }}
        TEXT_RIGHT: ${{ inputs.text_right }}
        BG_COLOR_LEFT: ${{ inputs.bg_color_left }}
        BG_COLOR_RIGHT: ${{ inputs.bg_color_right }}
        TEXT_COLOR: ${{ inputs.text_color }}
        FILENAME: ${{ inputs.filename }}
      run: |
        set -euo pipefail
        echo "DEBUG: Generating badge"
        echo "DEBUG: WIDTH=$WIDTH HEIGHT=$HEIGHT TEXT_RIGHT=$TEXT_RIGHT FILENAME=$FILENAME"
        HALF_WIDTH=$(( WIDTH / 2 ))
        QUARTER_WIDTH=$(( WIDTH / 4 ))
        THREE_QUARTERS=$(( WIDTH * 3 / 4 ))

        # Use relative path — GitHub Actions handles persistence across container/host boundary
        OUTPUT_PATH="${FILENAME}"
        echo "DEBUG: OUTPUT_PATH=$OUTPUT_PATH (relative to workspace)"
        echo "DEBUG: GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        mkdir -p "$(dirname "$OUTPUT_PATH")"

        cat <<EOF | sed 's/^        //' > "$OUTPUT_PATH"
        <svg xmlns="http://www.w3.org/2000/svg" width="${WIDTH}" height="${HEIGHT}">
            <linearGradient id="b" x2="0" y2="100%">
                <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
                <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
                <rect width="${WIDTH}" height="${HEIGHT}" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
                <rect width="${HALF_WIDTH}" height="${HEIGHT}" fill="${BG_COLOR_LEFT}"/>
                <rect x="${HALF_WIDTH}" width="${HALF_WIDTH}" height="${HEIGHT}" fill="${BG_COLOR_RIGHT}"/>
                <rect width="${WIDTH}" height="${HEIGHT}" fill="url(#b)"/>
            </g>
            <g fill="${TEXT_COLOR}" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
                <text x="${QUARTER_WIDTH}" y="15" fill="#010101" fill-opacity=".3">${TEXT_LEFT}</text>
                <text x="${QUARTER_WIDTH}" y="14">${TEXT_LEFT}</text>
                <text x="${THREE_QUARTERS}" y="15" fill="#010101" fill-opacity=".3">${TEXT_RIGHT}</text>
                <text x="${THREE_QUARTERS}" y="14">${TEXT_RIGHT}</text>
            </g>
        </svg>
        EOF
        echo "DEBUG: File created: $OUTPUT_PATH"
        [ -f "$OUTPUT_PATH" ] && echo "DEBUG: File exists, size=$(wc -c < "$OUTPUT_PATH")" || echo "DEBUG: File DOES NOT EXIST!"
        echo "filepath=${OUTPUT_PATH}" >> $GITHUB_OUTPUT
