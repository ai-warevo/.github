# cmake-build — Configure, build, and optionally install with CMake
#
# Wraps the standard CMake configure → build → install lifecycle into a single
# reusable step. Supports multi-config generators (MSVC) via the `config` input
# and optional `cmake --install`.
#
# In a container-based CI (e.g. ghcr.io/ai-warevo/ci-cpp23) all compilers and
# tools are pre-installed. This action simply passes through the arguments.
#
# Usage:
#   - name: Configure & Build
#     uses: ai-warevo/<repo>/.github/actions/cmake-build@6cae36f7fe728c23b1a6170d09d6dace55edea77
#     with:
#       source_dir: .
#       build_dir: build
#       build_type: Debug
#       extra_args: -DAW_TPL_BUILD_TESTS=ON
#   # With toolchain args from setup-toolchain:
#   - uses: ai-warevo/<repo>/.github/actions/cmake-build@6cae36f7fe728c23b1a6170d09d6dace55edea77
#     with:
#       extra_args: "${{ steps.tc.outputs.cmake_args }} -DAW_TPL_WARNINGS_AS_ERRORS=ON"

name: 'CMake Build'
description: 'Configure, build, and optionally install a CMake project'

inputs:
  source_dir:
    description: 'Source directory (relative to workspace)'
    required: false
    default: '.'
  build_dir:
    description: 'Build directory (relative to source_dir)'
    required: false
    default: 'build'
  build_type:
    description: 'CMAKE_BUILD_TYPE (Debug, Release, RelWithDebInfo, MinSizeRel)'
    required: false
    default: 'Release'
  extra_args:
    description: 'Additional CMake configure arguments (space-separated)'
    required: false
    default: ''
  parallel:
    description: 'Use --parallel for build (default: true)'
    required: false
    default: 'true'
  config:
    description: 'Build config for multi-config generators (e.g. Release for MSVC). Empty = auto-detect from build_type.'
    required: false
    default: ''
  install:
    description: 'Run cmake --install after build (default: false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # ── Configure CMake (Linux/macOS) ──
    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        BUILD_DIR: ${{ inputs.build_dir }}
        BUILD_TYPE: ${{ inputs.build_type }}
        EXTRA_ARGS: ${{ inputs.extra_args }}
      run: |
        set -euo pipefail

        # setup-toolchain emits compiler/linker flags as one CMake definition,
        # but the value may contain spaces. Rebuild those definitions as single
        # argv entries after Bash has split the space-separated input. Repeated
        # definitions are merged because CMake keeps only the last one.
        EXTRA_ARGS_ARRAY=()
        CURRENT_FLAGS_INDEX=-1
        read -r -a EXTRA_ARGS_WORDS <<< "$EXTRA_ARGS"
        for ARG in "${EXTRA_ARGS_WORDS[@]}"; do
          case "$ARG" in
            -DCMAKE_*_FLAGS=*)
              FLAG_NAME=${ARG%%=*}
              CURRENT_FLAGS_INDEX=-1
              for INDEX in "${!EXTRA_ARGS_ARRAY[@]}"; do
                case "${EXTRA_ARGS_ARRAY[$INDEX]}" in
                  "$FLAG_NAME="*)
                    CURRENT_FLAGS_INDEX=$INDEX
                    break
                    ;;
                esac
              done
              if [ "$CURRENT_FLAGS_INDEX" -ge 0 ]; then
                EXTRA_ARGS_ARRAY[$CURRENT_FLAGS_INDEX]="${EXTRA_ARGS_ARRAY[$CURRENT_FLAGS_INDEX]} ${ARG#*=}"
              else
                EXTRA_ARGS_ARRAY+=("$ARG")
                CURRENT_FLAGS_INDEX=$((${#EXTRA_ARGS_ARRAY[@]} - 1))
              fi
              ;;
            -D*|-G*)
              EXTRA_ARGS_ARRAY+=("$ARG")
              CURRENT_FLAGS_INDEX=-1
              ;;
            *)
              if [ "$CURRENT_FLAGS_INDEX" -ge 0 ]; then
                EXTRA_ARGS_ARRAY[$CURRENT_FLAGS_INDEX]="${EXTRA_ARGS_ARRAY[$CURRENT_FLAGS_INDEX]} $ARG"
              else
                EXTRA_ARGS_ARRAY+=("$ARG")
              fi
              ;;
          esac
        done

        echo "Configuring: cmake -S $SOURCE_DIR -B $SOURCE_DIR/$BUILD_DIR -DCMAKE_BUILD_TYPE=$BUILD_TYPE ${EXTRA_ARGS_ARRAY[*]}"
        cmake -S "$SOURCE_DIR" -B "$SOURCE_DIR/$BUILD_DIR" \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          "${EXTRA_ARGS_ARRAY[@]}"

    # ── Configure CMake (Windows) ──
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        BUILD_DIR: ${{ inputs.build_dir }}
        BUILD_TYPE: ${{ inputs.build_type }}
        EXTRA_ARGS: ${{ inputs.extra_args }}
      run: |
        $sourceDir = $env:SOURCE_DIR
        $buildDir = $env:BUILD_DIR
        $buildType = $env:BUILD_TYPE
        $extraArgs = $env:EXTRA_ARGS
        
        $args = @("-S", $sourceDir, "-B", "$sourceDir/$buildDir", "-DCMAKE_BUILD_TYPE=$buildType", "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON")
        if ($extraArgs) {
          $args += $extraArgs.Split(' ')
        }
        
        Write-Host "Configuring: cmake $($args -join ' ')"
        & cmake @args
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # ── Build (Linux/macOS) ──
    - name: Build (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        BUILD_DIR: ${{ inputs.build_dir }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        PARALLEL_FLAG="${{ inputs.parallel == 'true' && '--parallel' || '' }}"
        if [ -n "${CONFIG}" ]; then
          CONFIG_FLAG="--config $CONFIG"
        else
          CONFIG_FLAG=""
        fi
        echo "Building: cmake --build $SOURCE_DIR/$BUILD_DIR $PARALLEL_FLAG $CONFIG_FLAG"
        cmake --build "$SOURCE_DIR/$BUILD_DIR" $PARALLEL_FLAG $CONFIG_FLAG

    # ── Build (Windows) ──
    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        BUILD_DIR: ${{ inputs.build_dir }}
        CONFIG: ${{ inputs.config }}
      run: |
        $sourceDir = $env:SOURCE_DIR
        $buildDir = $env:BUILD_DIR
        $config = $env:CONFIG
        $parallel = "${{ inputs.parallel }}" -eq 'true'
        
        $args = @("--build", "$sourceDir/$buildDir")
        if ($parallel) { $args += "--parallel" }
        if ($config) { $args += "--config", $config }
        
        Write-Host "Building: cmake $($args -join ' ')"
        & cmake @args
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # ── Install (optional, Unix) ──
    - name: Install CMake Package (Unix)
      if: inputs.install == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        BUILD_DIR: ${{ inputs.build_dir }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        if [ -n "${CONFIG}" ]; then
          CONFIG_FLAG="--config $CONFIG"
        else
          CONFIG_FLAG=""
        fi
        cmake --install "$SOURCE_DIR/$BUILD_DIR" $CONFIG_FLAG

    # ── Install (optional, Windows) ──
    - name: Install CMake Package (Windows)
      if: inputs.install == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        BUILD_DIR: ${{ inputs.build_dir }}
        CONFIG: ${{ inputs.config }}
      run: |
        $sourceDir = $env:SOURCE_DIR
        $buildDir = $env:BUILD_DIR
        $config = $env:CONFIG
        
        $args = @("--install", "$sourceDir/$buildDir")
        if ($config) { $args += "--config", $config }
        
        & cmake @args
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
