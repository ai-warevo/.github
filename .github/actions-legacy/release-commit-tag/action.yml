name: 'Release Commit and Tag'
description: 'Commit release metadata, create an annotated tag, and push both to origin'

inputs:
  version:
    description: 'Release version with v prefix (e.g., v1.2.3)'
    required: true
  branch:
    description: 'Branch to receive the release commit'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Commit release metadata and push tag
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail

        if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
          echo "::error::Tag $RELEASE_VERSION already exists; refusing to overwrite it"
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md VERSION
        if git diff --cached --quiet; then
          echo "::error::Release metadata has no changes; refusing to create a duplicate release"
          exit 1
        fi

        version="${RELEASE_VERSION#v}"
        git commit -m "chore(release): version $version"
        git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
        
        echo "Pushing branch $RELEASE_BRANCH..."
        git push origin "HEAD:$RELEASE_BRANCH"
        
        echo "Pushing tag $RELEASE_VERSION..."
        # Retry tag push with exponential backoff (GitHub may have rate limits or temporary issues)
        for attempt in 1 2 3; do
          if git push origin "$RELEASE_VERSION"; then
            echo "Tag pushed successfully"
            exit 0
          fi
          if [ $attempt -lt 3 ]; then
            echo "Tag push failed, retrying in $((2 ** attempt))s..."
            sleep $((2 ** attempt))
          fi
        done
        
        echo "::error::Failed to push tag after 3 attempts"
        exit 1
