# coverage-html-deploy — Deploy coverage HTML report to GitHub Pages
#
# Creates .nojekyll marker and deploys the coverage HTML directory
# directly to the target branch (no external actions required).
#
# Usage:
#   - name: Deploy Coverage HTML
#     uses: ai-warevo/<repo>/.github/actions/coverage-html-deploy@6cae36f7fe728c23b1a6170d09d6dace55edea77
#     with:
#       folder: htmlcov
#       branch: gh-pages

name: 'Coverage HTML Deploy'
description: 'Deploy coverage HTML report to GitHub Pages (self-contained)'

inputs:
  folder:
    description: 'Coverage HTML directory (relative to workspace)'
    required: false
    default: 'htmlcov'
  branch:
    description: 'Target GitHub Pages branch'
    required: false
    default: 'gh-pages'
  target_folder:
    description: 'Target folder on the Pages branch'
    required: false
    default: '.'
  nojekyll:
    description: 'Create .nojekyll marker (default: true)'
    required: false
    default: 'true'
  token:
    description: 'GitHub token for authentication (leave empty to use the runner token)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # ── Prepare coverage HTML ──
    - name: Prepare Coverage HTML
      if: inputs.nojekyll == 'true'
      shell: bash
      run: mkdir -p "${{ inputs.folder }}" && touch "${{ inputs.folder }}/.nojekyll"

    # ── Deploy (self-contained, no external actions) ──
    - name: Deploy Coverage HTML to GitHub Pages
      shell: bash
      env:
        FOLDER: ${{ inputs.folder }}
        BRANCH: ${{ inputs.branch }}
        TARGET: ${{ inputs.target_folder }}
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
      run: |
        set -euo pipefail

        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Ensure we can push
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "::error::GITHUB_TOKEN is not set"
          exit 1
        fi

        # Save coverage HTML to temp location (git checkout will remove untracked files)
        TEMP_COV="$(mktemp -d)"
        if [ -d "$FOLDER" ]; then
          cp -r "$FOLDER"/. "$TEMP_COV/"
          echo "Saved coverage HTML to temp: $TEMP_COV ($(du -sh $TEMP_COV | cut -f1))"
        else
          echo "::error::Coverage folder $FOLDER does not exist"
          exit 1
        fi

        # Remove the original folder so git checkout doesn't complain about untracked files
        rm -rf "$FOLDER"

        # Remove any other untracked files (e.g., coverage.xml from test setup)
        git clean -fd

        # Create or checkout the target branch
        if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
          # Branch exists on remote, check it out
          git fetch origin "$BRANCH:$BRANCH" 2>/dev/null || true
          git checkout "$BRANCH"
        else
          # Branch doesn't exist, create it as orphan
          git checkout --orphan "$BRANCH"
          git rm -rf . 2>/dev/null || true
        fi

        # Copy coverage HTML from temp to target folder
        mkdir -p "$TARGET"
        cp -r "$TEMP_COV"/. "$TARGET/"
        rm -rf "$TEMP_COV"
        
        echo "Deployed coverage HTML to $TARGET/ ($(find $TARGET -type f | wc -l) files)"

        # Commit and push
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to deploy"
          exit 0
        fi
        git commit -m "Deploy coverage HTML: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH" --force
