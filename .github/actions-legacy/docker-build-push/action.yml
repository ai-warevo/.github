# docker-build-push — Build and push a Docker image to a registry
#
# Wraps the standard Docker pipeline: setup-buildx → login → build-push.
#
# Usage:
#   - name: Build and push Docker image
#     uses: ai-warevo/<repo>/.github/actions/docker-build-push@6cae36f7fe728c23b1a6170d09d6dace55edea77
#     with:
#       context: ./example
#       dockerfile: example/Dockerfile
#       registry: ghcr.io
#       image_name: ai-warevo/example
#       tags: |
#         ghcr.io/ai-warevo/example:1.2.3
#         ghcr.io/ai-warevo/example:latest

name: 'Docker Build and Push'
description: 'Build and push a Docker image to a container registry'

inputs:
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path (relative to repository root, NOT context)'
    required: false
    default: 'Dockerfile'
  registry:
    description: 'Container registry URL'
    required: false
    default: 'ghcr.io'
  image_name:
    description: 'Image name (e.g. org/repo)'
    required: true
  tags:
    description: 'Docker image tags (one per line)'
    required: true
  push:
    description: 'Push the image (default: true)'
    required: false
    default: 'true'
  load:
    description: 'Load the image into the local Docker daemon (default: false)'
    required: false
    default: 'false'
  github_token:
    description: 'GitHub token for registry authentication'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to ${{ inputs.registry }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        tags: ${{ inputs.tags }}
