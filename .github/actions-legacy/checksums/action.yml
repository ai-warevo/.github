name: 'Checksum Generator'
description: 'Generates SHA256SUMS.txt for files in a directory'

inputs:
  artifacts_dir:
    description: 'Directory with files to generate checksums for'
    required: true
  checksums_file:
    description: 'Checksums filename'
    required: false
    default: 'SHA256SUMS.txt'

outputs:
  checksums_file:
    description: 'Path to the generated checksums file'
    value: ${{ steps.generate.outputs.checksums_file }}
  file_count:
    description: 'Number of files with checksums'
    value: ${{ steps.generate.outputs.file_count }}

runs:
  using: 'composite'
  steps:
    - name: Generate SHA256 checksums
      id: generate
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        CHECKSUMS_FILE: ${{ inputs.checksums_file }}
      run: |
        set -euo pipefail

        cd "$ARTIFACTS_DIR"

        # Generate checksums for all files except the checksums file itself
        if compgen -G "*" > /dev/null 2>&1; then
          sha256sum $(find . -maxdepth 1 -type f ! -name "$CHECKSUMS_FILE" -printf '%f\n') > "$CHECKSUMS_FILE"
          COUNT=$(wc -l < "$CHECKSUMS_FILE")
        else
          # No artifacts — create an empty file
          touch "$CHECKSUMS_FILE"
          COUNT=0
        fi

        echo "checksums_file=${CHECKSUMS_FILE}" >> $GITHUB_OUTPUT
        echo "file_count=$COUNT" >> $GITHUB_OUTPUT
        echo "Generated $COUNT checksums in $CHECKSUMS_FILE"
