name: 'Changelog Generator'
description: 'Generates [Unreleased] section in CHANGELOG.md from git log (conventional commits)'

inputs:
  changelog:
    description: 'Path to CHANGELOG.md (default: CHANGELOG.md)'
    required: false
    default: 'CHANGELOG.md'
  force:
    description: 'Overwrite [Unreleased] even if it already has entries (default: false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Generate changelog from git log
      id: generate
      shell: bash
      env:
        CHANGELOG_PATH: ${{ inputs.changelog }}
        FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail

        changelog="$CHANGELOG_PATH"
        [ -f "$changelog" ] || { echo "::error::CHANGELOG.md not found"; exit 1; }

        # Determine the previous tag (latest v* tag).
        # For releases: use the two most recent tags (since the latest was just created).
        # For dev builds: use latest tag..HEAD.
        all_tags="$(git tag -l 'v*' --sort=-version:refname)"
        latest_tag="$(echo "$all_tags" | head -n1)"
        second_latest_tag="$(echo "$all_tags" | head -n2 | tail -n1)"
        
        if [ -n "$latest_tag" ]; then
          # Dereference tag to commit (handles annotated tags)
          latest_commit="$(git rev-parse ${latest_tag}^{} 2>/dev/null || git rev-parse ${latest_tag})"
          head_commit="$(git rev-parse HEAD)"
          
          # If latest tag is on HEAD, we're in release mode (tag was just created)
          if [ "$latest_commit" = "$head_commit" ]; then
            # Use the range between the two most recent tags
            if [ -n "$second_latest_tag" ]; then
              range="${second_latest_tag}..${latest_tag}"
            else
              range="${latest_tag}"
            fi
          else
            # Normal dev mode: use latest tag..HEAD
            range="${latest_tag}..HEAD"
          fi
        else
          range="HEAD"
        fi

        commits="$(git log --pretty=format:'%s' "$range" 2>/dev/null || true)"
        
        # Check if [Unreleased] already has entries (unless --force).
        if [ "$FORCE" != "true" ] && grep -q '^## \[Unreleased\]' "$changelog"; then
          unreleased_body="$(awk '/^## \[Unreleased\]/ { found=1; next } found && /^## \[/ { exit } found { print }' "$changelog")"
          if [ -n "$unreleased_body" ]; then
            echo "::error::[Unreleased] already has entries. Use --force to overwrite, or run release first."
            exit 1
          fi
        fi
        
        [ -n "$commits" ] || { echo "No commits found in $range"; exit 0; }

        # Categorize commits.
        declare -a cat_breaking=() cat_added=() cat_fixed=() cat_changed=() cat_removed=()
        skip_keywords=(workflow github action deps dependency format lint prettier eslint)

        is_skip() {
          local line="$1"
          [[ "$line" == ci\(* || "$line" == chore\(* ]] || return 1
          for kw in "${skip_keywords[@]}"; do
            [[ "$line" == *"$kw"* ]] && return 0
          done
          return 1
        }

        clean_entry() {
          echo "$1" | sed -E 's/^[a-z]+\([^)]*\): *//; s/^[a-z]+: *//'
        }

        add_entry() {
          local category="$1" subject="$2"
          local entry
          entry="$(clean_entry "$subject")"
          case "$category" in
            breaking) cat_breaking+=("$entry") ;;
            added)    cat_added+=("$entry") ;;
            fixed)    cat_fixed+=("$entry") ;;
            changed)  cat_changed+=("$entry") ;;
            removed)  cat_removed+=("$entry") ;;
          esac
        }

        while IFS= read -r line; do
          [ -z "$line" ] && continue
          local_type=""

          # Breaking change detection
          if [[ "$line" == *"BREAKING CHANGE"* || "$line" == [a-z]*")!:"* || "$line" == [a-z]*"!:"* ]]; then
            local_type="breaking"
            line="${line//!:/ :}"
          fi

          # Skip infra-only ci/chore
          is_skip "$line" && continue

          # Map conventional commit prefix
          if [[ "$line" == feat\(* || "$line" == feat:* ]]; then
            local_type="${local_type:+$local_type,}added"
          elif [[ "$line" == fix\(* || "$line" == fix:* ]]; then
            local_type="${local_type:+$local_type,}fixed"
          elif [[ "$line" == perf\(* || "$line" == perf:* || "$line" == refactor\(* || "$line" == refactor:* || "$line" == docs\(* || "$line" == docs:* || "$line" == style\(* || "$line" == style:* || "$line" == chore\(* || "$line" == chore:* || "$line" == ci\(* || "$line" == ci:* || "$line" == build\(* || "$line" == build:* ]]; then
            local_type="${local_type:+$local_type,}changed"
          elif [[ "$line" == test\(* || "$line" == test:* ]]; then
            local_type="${local_type:+$local_type,}fixed"
          elif [[ "$line" == revert\(* || "$line" == revert:* ]]; then
            local_type="${local_type:+$local_type,}removed"
          else
            local_type="${local_type:+$local_type,}changed"
          fi

          IFS=',' read -ra types <<< "$local_type"
          for t in "${types[@]}"; do
            add_entry "$t" "$line"
          done
        done <<< "$commits"

        # Build section.
        section_file="$(mktemp)"
        trap 'rm -f "$section_file"' EXIT

        echo "## [Unreleased]" > "$section_file"

        for key in breaking added changed deprecated fixed removed security; do
          local_display="${key^}"
          case "$key" in
            breaking) entries=("${cat_breaking[@]+"${cat_breaking[@]}"}") ;;
            added)    entries=("${cat_added[@]+"${cat_added[@]}"}") ;;
            fixed)    entries=("${cat_fixed[@]+"${cat_fixed[@]}"}") ;;
            changed)  entries=("${cat_changed[@]+"${cat_changed[@]}"}") ;;
            removed)  entries=("${cat_removed[@]+"${cat_removed[@]}"}") ;;
            *)        entries=() ;;
          esac
          [ "${#entries[@]}" -eq 0 ] && continue

          echo "" >> "$section_file"
          echo "### $local_display" >> "$section_file"
          echo "" >> "$section_file"
          for e in "${entries[@]}"; do echo "- $e" >> "$section_file"; done
        done

        # Write to changelog.
        work="$(mktemp)"
        out="$(mktemp)"
        trap 'rm -f "$work" "$out" "$section_file"' EXIT

        crlf=0
        grep -q $'\r' "$changelog" && crlf=1
        tr -d '\r' < "$changelog" > "$work"

        if grep -q '^## \[Unreleased\]' "$work"; then
          awk -v secfile="$section_file" '
            /^## \[Unreleased\]/ { in_u = 1; print; next }
            in_u && /^## \[/ {
              in_u = 0
              first = 1
              while ((getline line < secfile) > 0) { if (first) { first = 0; continue } print line }
              close(secfile)
              print ""
              print
              next
            }
            in_u { next }
            { print }
          ' "$work" > "$out"
        else
          awk -v secfile="$section_file" '
            /^# Changelog$/ { print; print ""; while ((getline line < secfile) > 0) print line; next }
            { print }
          ' "$work" > "$out"
        fi

        if [ "$crlf" -eq 1 ]; then sed 's/$/\r/' "$out" > "$changelog"; else cp "$out" "$changelog"; fi

        total=$(( ${#cat_breaking[@]} + ${#cat_added[@]} + ${#cat_fixed[@]} + ${#cat_changed[@]} + ${#cat_removed[@]} ))
        echo "entries=$total" >> $GITHUB_OUTPUT
        echo "Generated $total entry(s) in CHANGELOG.md [Unreleased]"
