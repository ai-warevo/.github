# ctest-run — Run CTest for a CMake project
#
# Wraps ctest execution with configurable build config and output options.
#
# Usage:
#   - name: Run Tests
#     uses: ai-warevo/<repo>/.github/actions/ctest-run@6cae36f7fe728c23b1a6170d09d6dace55edea77
#     with:
#       source_dir: example
#       build_dir: build
#       config: Debug
#       timeout: 120

name: 'CTest Run'
description: 'Run CTest for a CMake project'

inputs:
  source_dir:
    description: 'Source directory (relative to workspace)'
    required: false
    default: '.'
  build_dir:
    description: 'Build directory (relative to source_dir)'
    required: false
    default: 'build'
  config:
    description: 'CMake build configuration (Debug, Release, etc.)'
    required: false
    default: ''
  output_on_failure:
    description: 'Show output only on failure (default: true)'
    required: false
    default: 'true'
  timeout:
    description: 'Test timeout in seconds'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # ── Run CTest (Unix) ──
    - name: Run CTest (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd "${{ inputs.source_dir }}/${{ inputs.build_dir }}"
        CTEST_ARGS=()
        if [ -n "${{ inputs.config }}" ]; then
          CTEST_ARGS+=("-C" "${{ inputs.config }}")
        fi
        if [ "${{ inputs.output_on_failure }}" = "true" ]; then
          CTEST_ARGS+=("--output-on-failure")
        fi
        if [ -n "${{ inputs.timeout }}" ]; then
          CTEST_ARGS+=("--timeout" "${{ inputs.timeout }}")
        fi
        ctest "${CTEST_ARGS[@]}"

    # ── Run CTest (Windows) ──
    - name: Run CTest (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-Location "${{ inputs.source_dir }}/${{ inputs.build_dir }}"
        $args = @()
        if ("${{ inputs.config }}") {
          $args += "-C", "${{ inputs.config }}"
        }
        if ("${{ inputs.output_on_failure }}" -eq "true") {
          $args += "--output-on-failure"
        }
        if ("${{ inputs.timeout }}") {
          $args += "--timeout", "${{ inputs.timeout }}"
        }
        & ctest @args
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
