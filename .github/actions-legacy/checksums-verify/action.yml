# checksums-verify — Verify SHA256 checksums against a checksums file
#
# Verifies file integrity against a pre-generated SHA256SUMS.txt.
# Useful during the release phase for verifying artifacts before publishing.
#
# Usage:
#   - name: Verify checksums
#     uses: ai-warevo/<repo>/.github/actions/checksums-verify@72e62471355bf347d09c7e183af5fd33bf41fbaf
#     with:
#       artifacts_dir: release-artifacts/1.2.3
#       checksums_file: SHA256SUMS.txt

name: 'Checksums Verify'
description: 'Verify SHA256 checksums of files against a checksums file'

inputs:
  artifacts_dir:
    description: 'Directory with files to verify'
    required: true
  checksums_file:
    description: 'Checksums filename'
    required: false
    default: 'SHA256SUMS.txt'

runs:
  using: 'composite'
  steps:
    - name: Verify SHA256 checksums
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        CHECKSUMS_FILE: ${{ inputs.checksums_file }}
      run: |
        set -euo pipefail

        cd "$ARTIFACTS_DIR"

        if [ ! -f "$CHECKSUMS_FILE" ]; then
          echo "::error::Checksums file not found: $CHECKSUMS_FILE"
          exit 1
        fi

        if [ ! -s "$CHECKSUMS_FILE" ]; then
          echo "Checksums file is empty — nothing to verify"
          exit 0
        fi

        echo "Verifying checksums from $CHECKSUMS_FILE..."
        sha256sum --check "$CHECKSUMS_FILE"

        echo "✅ All checksums verified successfully"
