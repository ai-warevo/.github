# Unit Tests - clang-tidy
#
# Tests: run clang-tidy on the example project (requires build with compile_commands.json)

name: Unit Tests - clang-tidy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: clang-tidy
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy — scan example
        id: clang_tidy
        uses: ai-warevo/.github/.github/actions/clang-tidy@main
        with:
          source_dir: example
          build_dir: build
          exclude: _deps,build,CMakeFiles,cmake

      - name: clang-tidy — validate
        run: echo "✓ clang-tidy — scan complete"
