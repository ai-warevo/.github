name: example-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'example/**'
      - '.github/workflows/example-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'example/**'
      - '.github/workflows/example-ci.yml'

permissions:
  contents: write

jobs:
  tests-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_ENABLE_COVERAGE=ON

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: example
          build_dir: build
          config: Debug

      - name: Generate Coverage
        uses: ai-warevo/.github/.github/actions/gcovr-report@main
        with:
          source_dir: example
          build_dir: build
          source_filter: plugin/src/ plugin/tests/ host/src/ include/
          exclude: _deps/*
          output_dir: htmlcov

      - name: Parse Coverage Metrics
        id: coverage_parser
        uses: ai-warevo/.github/.github/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        uses: ai-warevo/.github/.github/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}%'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Upload Badge
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-badge
          path: coverage.svg
          retention-days: 1
          if-no-files-found: error

      - name: Upload Coverage HTML
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy Badges & HTML
    runs-on: ubuntu-latest
    needs: tests-and-coverage
    if: needs.tests-and-coverage.result == 'success' && (!github.event.pull_request || !github.event.pull_request.head.repo.fork)
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download Badge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-badge
          path: .

      - name: Download Coverage HTML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-html
          path: htmlcov/

      - name: Debug — list files
        if: always()
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== ls -la ==="
          ls -la
          echo "=== htmlcov/ ==="
          ls -la htmlcov/ 2>&1 || echo "htmlcov/ not found"
          echo "=== coverage.svg ==="
          ls -la coverage.svg 2>&1 || echo "coverage.svg not found"
          echo "=== coverage.svg content ==="
          cat coverage.svg 2>&1 || echo "coverage.svg not found"

      - name: Deploy Badge
        uses: ai-warevo/.github/.github/actions/badge-deploy@main
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage HTML
        uses: ai-warevo/.github/.github/actions/coverage-html-deploy@main
        with:
          folder: htmlcov
          target_folder: .

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root --security-opt seccomp=unconfined

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address, thread ]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: example
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_SANITIZE=${{ matrix.sanitizer }}

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: example
          build_dir: build
          timeout: 120
