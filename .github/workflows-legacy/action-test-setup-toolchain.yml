# Unit Tests - setup-toolchain
#
# Tests: container mode — verify CMake args are computed correctly for each toolchain

name: Unit Tests - setup-toolchain

on:
  workflow_call:

permissions:
  contents: read

jobs:
  clang18-libcxx:
    name: clang18-libcxx
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: setup-toolchain — clang18-libcxx
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true

      - name: validate
        run: |
          set -euo pipefail
          echo "${{ steps.tc.outputs.cmake_args }}" | grep -q "clang++-18" || \
            { echo "::error::compiler mismatch"; exit 1; }
          echo "${{ steps.tc.outputs.stdlib }}" = "libc++" || \
            { echo "::error::stdlib mismatch"; exit 1; }
          echo "✓ setup-toolchain — clang18-libcxx"

  clang18-libcxx-asan:
    name: clang18-libcxx (ASan)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: setup-toolchain — clang18-libcxx + address sanitizer
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true
          sanitizer: address

      - name: validate
        run: |
          set -euo pipefail
          echo "${{ steps.tc.outputs.cmake_args }}" | grep -q "fsanitize=address" || \
            { echo "::error::ASan flag missing"; exit 1; }
          echo "✓ setup-toolchain — clang18-libcxx + ASan"

  gcc15:
    name: gcc15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: setup-toolchain — gcc15
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: gcc15
          container_mode: true

      - name: validate
        run: |
          set -euo pipefail
          echo "${{ steps.tc.outputs.cmake_args }}" | grep -q "g++-15" || \
            { echo "::error::compiler mismatch"; exit 1; }
          echo "${{ steps.tc.outputs.stdlib }}" = "libstdc++" || \
            { echo "::error::stdlib mismatch"; exit 1; }
          echo "✓ setup-toolchain — gcc15"
