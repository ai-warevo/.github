# reusable-release — derive version → promote changelog → publish release
#
# Reusable workflow (workflow_call). Project workflows own project-specific
# builds, Docker images, and release artifacts, then pass artifact names here.
#
# Consumers call via:
#   uses: ai-warevo/.github/.github/workflows/reusable-release.yml@<sha>
#
# Inputs:
#   version             — version override ("auto" or X.Y.Z)
#   artifact_name      — uploaded artifact name to attach to release
#   artifact_directory — download directory for release artifacts

name: reusable-release

on:
  workflow_call:
    inputs:
      version:
        description: 'Version override ("auto" to derive from changelog, or explicit e.g. 1.2.3)'
        type: string
        default: 'auto'
      artifact_name:
        description: 'Uploaded artifact name to attach to the release'
        type: string
        default: ''
      artifact_directory:
        description: 'Directory where release artifacts are downloaded'
        type: string
        default: artifacts
      what-included:
        description: 'What''s Included section for release notes'
        type: string
        default: ''
      quick-start:
        description: 'Quick Start section for release notes'
        type: string
        default: ''
    outputs:
      release_version:
        description: 'Full release version with v prefix'
        value: ${{ jobs.version-derive.outputs.release_version }}
      release_version_stripped:
        description: 'Release version without v prefix'
        value: ${{ jobs.version-derive.outputs.release_version_stripped }}

permissions:
  contents: write
  actions: write

jobs:
  # ── Phase 1: Derive version from changelog ──────────────────────────
  version-derive:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_version_stripped: ${{ steps.version.outputs.release_version_stripped }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        if: github.event_name == 'workflow_dispatch'
        uses: ai-warevo/.github/.github/actions/changelog-generate@main
        with:
          force: 'true'

      - name: Resolve version
        id: version
        uses: ai-warevo/.github/.github/actions/release-version@main
        with:
          version: ${{ inputs.version }}

      - name: Upload generated changelog
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-changelog
          path: CHANGELOG.md
          if-no-files-found: error

  # ── Phase 2: Publish release ────────────────────────────────────────
  release-publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: version-derive
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download generated changelog
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-changelog
          path: .

      - name: Promote changelog
        if: github.event_name == 'workflow_dispatch'
        uses: ai-warevo/.github/.github/actions/changelog-promote@main
        with:
          version: ${{ needs.version-derive.outputs.release_version_stripped }}

      - name: Commit CHANGELOG.md and VERSION, create tag
        if: github.event_name == 'workflow_dispatch'
        uses: ai-warevo/.github/.github/actions/release-commit-tag@main
        with:
          version: ${{ needs.version-derive.outputs.release_version }}
          branch: ${{ github.ref_name }}

      - name: Download release artifacts
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_directory }}

      - name: Generate checksums
        if: inputs.artifact_name != ''
        uses: ai-warevo/.github/.github/actions/checksums@main
        with:
          artifacts_dir: ${{ inputs.artifact_directory }}
          checksums_file: SHA256SUMS.txt

      - name: Verify checksums
        if: inputs.artifact_name != ''
        uses: ai-warevo/.github/.github/actions/checksums-verify@main
        with:
          artifacts_dir: ${{ inputs.artifact_directory }}
          checksums_file: SHA256SUMS.txt

      - name: Generate Release Notes
        id: changelog
        uses: ai-warevo/.github/.github/actions/changelog-release@main
        with:
          tag: ${{ needs.version-derive.outputs.release_version }}
          what-included: ${{ inputs.what-included }}
          quick-start: ${{ inputs.quick-start }}

      - name: Create Release with artifacts
        if: inputs.artifact_name != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.version-derive.outputs.release_version }}
          name: ${{ needs.version-derive.outputs.release_version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            ${{ inputs.artifact_directory }}/**
          generate_release_notes: false

      - name: Create Release
        if: inputs.artifact_name == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.version-derive.outputs.release_version }}
          name: ${{ needs.version-derive.outputs.release_version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          generate_release_notes: false
