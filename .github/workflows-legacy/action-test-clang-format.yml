# Unit Tests - clang-format
#
# Tests: check formatting on repo files (requires clang-format-18)

name: Unit Tests - clang-format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare clang-format config and input
        run: |
          printf 'BasedOnStyle: LLVM\n' > /tmp/clang-format.yml
          mkdir -p /tmp/clang-format-test
          printf 'int main() { return 0; }\n' > /tmp/clang-format-test/test.cpp
          clang-format -i --style=file:/tmp/clang-format.yml /tmp/clang-format-test/test.cpp

      - name: clang-format — check test file
        id: clang_fmt
        uses: ai-warevo/.github/.github/actions/clang-format@main
        with:
          source_dir: /tmp/clang-format-test
          extensions: cpp,hpp
          config_file: /tmp/clang-format.yml
          exclude: _deps/*,build/*,CMakeFiles/*,cmake/*

      - name: clang-format — validate
        run: echo "✓ clang-format — all files properly formatted"
