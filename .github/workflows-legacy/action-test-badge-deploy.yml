# Unit Tests - badge-deploy
#
# Tests: deploy badge SVG to a test branch

name: Unit Tests - badge-deploy

on:
  workflow_call:

permissions:
  contents: write

jobs:
  test:
    name: badge-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # ── generate badge ──
      - name: Generate badge for deploy
        id: badge
        uses: ai-warevo/.github/.github/actions/badge@main
        with:
          text_left: 'coverage'
          text_right: '90%'
          bg_color_right: '#44cc11'
          filename: 'coverage.svg'

      - name: badge-deploy — to test branch
        id: badge_deploy
        uses: ai-warevo/.github/.github/actions/badge-deploy@main
        with:
          badge_path: coverage.svg
          branch: actions-test/badge
          target_folder: test-badges

      - name: badge-deploy — validate
        run: echo "✓ badge-deploy → actions-test:test-badges/"
