# Unit Tests - ctest-run
#
# Tests: run CTest on the example project (requires cmake-build to have run first)

name: Unit Tests - ctest-run

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ctest-run
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON

      - name: Run tests
        id: test
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: example
          build_dir: build
          config: Debug
          output_on_failure: 'true'

      - name: ctest-run — validate
        run: echo "✓ ctest-run — tests passed"
