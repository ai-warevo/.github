# reusable-release-with-build — resolve version → build → commit/tag → publish
#
# Reusable workflow for projects where VERSION is embedded during build.
# Handles full release cycle:
#   1. Resolves version (auto from CHANGELOG or explicit)
#   2. Updates VERSION file for build
#   3. Caller builds with that VERSION
#   4. Commits, tags, and publishes release

name: reusable-release-with-build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version override (X.Y.Z); use auto to derive from CHANGELOG.md or empty for auto patch'
        type: string
        default: ''
      artifact_name:
        description: 'Artifact name to attach to release'
        type: string
        required: true
      artifact_directory:
        description: 'Directory where artifacts are located'
        type: string
        default: artifacts
      what-included:
        description: 'What''s Included section for release notes'
        type: string
        default: ''
      quick-start:
        description: 'Quick Start section for release notes'
        type: string
        default: ''
    outputs:
      release_version:
        description: 'Full release version with v prefix'
        value: ${{ jobs.resolve-version.outputs.release_version }}
      release_version_stripped:
        description: 'Release version without v prefix'
        value: ${{ jobs.resolve-version.outputs.release_version_stripped }}

permissions:
  contents: write

jobs:
  # Phase 1: Resolve version
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_version_stripped: ${{ steps.version.outputs.release_version_stripped }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        uses: ai-warevo/.github/.github/actions/changelog-generate@main
        with:
          force: 'true'
        continue-on-error: true

      - name: Determine version
        id: determine
        run: |
          version_input="${{ inputs.version }}"
          
          # If explicit version provided, use it
          if [ -n "$version_input" ]; then
            echo "version_to_use=$version_input" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if [Unreleased] has entries
          if grep -qE '^### (Breaking|Added|Deprecated|Changed|Removed|Fixed|Security)' CHANGELOG.md; then
            echo "version_to_use=auto" >> $GITHUB_OUTPUT
          else
            # No entries in [Unreleased], do patch bump
            current=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1 | sed 's/^v//')
            [ -z "$current" ] && current="0.0.0"
            IFS='.' read -r major minor patch <<< "$current"
            next="${major}.${minor}.$((patch + 1))"
            echo "version_to_use=$next" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Resolve version
        id: version
        uses: ai-warevo/.github/.github/actions/release-version@main
        with:
          version: ${{ steps.determine.outputs.version_to_use }}

  # Phase 2: Caller builds with resolved version (gitsync/.github/workflows/release.yml handles this)
  # This is signaled via outputs from this job

  # Phase 3: Commit, tag, and publish (called after caller's build+collect)
  commit-tag-publish:
    name: Commit, tag, and publish
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Update VERSION file
        run: echo "${{ needs.resolve-version.outputs.release_version_stripped }}" > VERSION
        shell: bash

      - name: Update CHANGELOG
        run: |
          version="${{ needs.resolve-version.outputs.release_version_stripped }}"
          date=$(date +%Y-%m-%d)
          sed -i "s/^\## \[Unreleased\]/## [$version] - $date/" CHANGELOG.md
          {
            head -6 CHANGELOG.md
            echo ""
            echo "## [Unreleased]"
            tail -n +7 CHANGELOG.md
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
        shell: bash

      - name: Commit and tag
        uses: ai-warevo/.github/.github/actions/release-commit-tag@main
        with:
          version: ${{ needs.resolve-version.outputs.release_version }}
          branch: ${{ github.ref_name }}

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_directory }}

      - name: Generate checksums
        uses: ai-warevo/.github/.github/actions/checksums@main
        with:
          artifacts_dir: ${{ inputs.artifact_directory }}
          checksums_file: SHA256SUMS.txt

      - name: Verify checksums
        uses: ai-warevo/.github/.github/actions/checksums-verify@main
        with:
          artifacts_dir: ${{ inputs.artifact_directory }}
          checksums_file: SHA256SUMS.txt

      - name: Generate Release Notes
        id: changelog
        uses: ai-warevo/.github/.github/actions/changelog-release@main
        with:
          tag: v${{ needs.resolve-version.outputs.release_version_stripped }}
          what-included: ${{ inputs.what-included }}
          quick-start: ${{ inputs.quick-start }}

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.resolve-version.outputs.release_version_stripped }}
          name: v${{ needs.resolve-version.outputs.release_version_stripped }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            ${{ inputs.artifact_directory }}/**
          generate_release_notes: false
