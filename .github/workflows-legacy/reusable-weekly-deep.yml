# reusable-weekly-deep — sanitizers + coverage + deploy
#
# Reusable workflow (workflow_call).
# Consumers call via:
#   uses: ai-warevo/.github/.github/workflows/reusable-weekly-deep.yml@<sha>
#
# Parameters:
#   source_dir          — source directory (default: example)
#   build_dir           — build directory (default: build)
#   container_image     — CI container image (default: ghcr.io/ai-warevo/ci-cpp23)
#   source_filter       — gcovr source filter (default: host/src/ plugin/src/ include/)
#   exclude             — gcovr exclude pattern (default: _deps/*)

name: reusable-weekly-deep

on:
  workflow_call:
    inputs:
      source_dir:
        description: 'Source directory'
        type: string
        default: example
      build_dir:
        description: 'Build directory'
        type: string
        default: build
      container_image:
        description: 'CI container image'
        type: string
        default: ghcr.io/ai-warevo/ci-cpp23
      source_filter:
        description: 'gcovr source filter'
        type: string
        default: host/src/ plugin/src/ include/
      exclude:
        description: 'gcovr exclude pattern'
        type: string
        default: _deps/*

permissions:
  contents: write
  packages: write

jobs:
  sanitizer-asan:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}
      options: --user root --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: RelWithDebInfo
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_SANITIZE=address

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          timeout: 120

  sanitizer-tsan:
    name: TSan
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}
      options: --user root --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: RelWithDebInfo
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_SANITIZE=thread

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          timeout: 120

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}
      options: --user root
    needs: [sanitizer-asan, sanitizer-tsan]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_ENABLE_COVERAGE=ON

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          config: Debug

      - name: Generate Coverage
        uses: ai-warevo/.github/.github/actions/gcovr-report@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          source_filter: ${{ inputs.source_filter }}
          exclude: ${{ inputs.exclude }}
          output_dir: htmlcov

      - name: Parse Coverage Metrics
        id: coverage_parser
        uses: ai-warevo/.github/.github/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        uses: ai-warevo/.github/.github/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}%'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Upload Badge
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-badge
          path: coverage.svg
          retention-days: 1

      - name: Upload Coverage HTML
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 1

  deploy:
    name: Deploy Badges & HTML
    runs-on: ubuntu-latest
    needs: coverage
    if: success() && (!github.event.pull_request || !github.event.pull_request.head.repo.fork)
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download Badge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-badge
          path: .

      - name: Download Coverage HTML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-html
          path: htmlcov/

      - name: Deploy Badge
        uses: ai-warevo/.github/.github/actions/badge-deploy@main
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage HTML
        uses: ai-warevo/.github/.github/actions/coverage-html-deploy@main
        with:
          folder: htmlcov
          target_folder: .
