# Unit Tests - docker-save
#
# Tests: pull image, save to tar, validate artifact

name: Unit Tests - docker-save

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: docker-save
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: docker-save — pull image
        run: docker pull alpine:3.19

      - name: docker-save — build & save
        id: docker_save
        uses: ai-warevo/.github/.github/actions/docker-save@main
        with:
          image: alpine
          tag: '3.19'
          output: alpine-image.tar
          artifact_name: test-docker-image

      - name: docker-save — validate
        run: |
          set -euo pipefail
          [ -f alpine-image.tar ] || { echo "::error::Docker tar not created"; exit 1; }
          echo "✓ docker-save → alpine-image.tar"
