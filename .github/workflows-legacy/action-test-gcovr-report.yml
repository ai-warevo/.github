# Unit Tests - gcovr-report
#
# Tests: generate coverage XML + HTML from the example project

name: Unit Tests - gcovr-report

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: gcovr-report
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_ENABLE_COVERAGE=ON

      - name: Run tests (required for gcov data)
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: example
          build_dir: build
          config: Debug
          output_on_failure: 'true'

      - name: Generate coverage
        id: coverage
        uses: ai-warevo/.github/.github/actions/gcovr-report@main
        with:
          source_dir: example
          build_dir: build
          source_filter: host/src/ plugin/src/ include/
          exclude: _deps/*
          output_dir: htmlcov
          xml_path: coverage.xml

      - name: gcovr-report — validate
        run: |
          set -euo pipefail
          [ -f "coverage.xml" ] || { echo "::error::coverage.xml missing"; exit 1; }
          [ -f "htmlcov/index.html" ] || { echo "::error::HTML report missing"; exit 1; }
          echo "✓ gcovr-report — XML + HTML generated"
