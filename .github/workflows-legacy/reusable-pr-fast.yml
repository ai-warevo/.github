# reusable-pr-fast — lint + build + unit tests on PR
#
# Reusable workflow (workflow_call).
# Consumers call via:
#   uses: ai-warevo/.github/.github/workflows/reusable-pr-fast.yml@<sha>
#
# Parameters:
#   source_dir         — source directory (default: example)
#   build_dir          — build directory (default: build)
#   build_type         — CMake build type (default: Debug)
#   extra_args         — extra CMake arguments (default: -DAW_EXAMPLE_BUILD_TESTS=ON)
#   extensions         — source file extensions for clang-format (default: cpp,hpp,c,h)
#   container_image    — CI container image (default: ghcr.io/ai-warevo/ci-cpp23)

name: reusable-pr-fast

on:
  workflow_call:
    inputs:
      source_dir:
        description: 'Source directory'
        type: string
        default: example
      build_dir:
        description: 'Build directory'
        type: string
        default: build
      build_type:
        description: 'CMake build type'
        type: string
        default: Debug
      extra_args:
        description: 'Extra CMake arguments'
        type: string
        default: -DAW_EXAMPLE_BUILD_TESTS=ON
      extensions:
        description: 'Source file extensions for clang-format'
        type: string
        default: cpp,hpp,c,h
      container_image:
        description: 'CI container image'
        type: string
        default: ghcr.io/ai-warevo/ci-cpp23
      setup_command:
        description: 'Optional Bash command to prepare the source tree after checkout'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare source tree
        if: inputs.setup_command != ''
        shell: bash
        env:
          PREPARE_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      - name: Check formatting
        uses: ai-warevo/.github/.github/actions/clang-format@main
        with:
          source_dir: ${{ inputs.source_dir }}
          extensions: ${{ inputs.extensions }}

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: clang-format
    container:
      image: ${{ inputs.container_image }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare source tree
        if: inputs.setup_command != ''
        shell: bash
        env:
          PREPARE_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: ${{ inputs.build_type }}
          extra_args: ${{ inputs.extra_args }}

      - name: Run clang-tidy
        uses: ai-warevo/.github/.github/actions/clang-tidy@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: clang-format
    container:
      image: ${{ inputs.container_image }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare source tree
        if: inputs.setup_command != ''
        shell: bash
        env:
          PREPARE_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: ${{ inputs.build_type }}
          extra_args: ${{ inputs.extra_args }}

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          config: ${{ inputs.build_type }}
          output_on_failure: 'true'
