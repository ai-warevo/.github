# clang-tidy — Run clang-tidy on C++ source files and fail on errors
#
# Scans C++ files through clang-tidy using the project's compile_commands.json.
# Non-zero exit (any warning from the selected check suite) fails the step.
#
# In a container (e.g. ci-cpp23) clang-tidy-18 is pre-installed.
#
# Usage:
#   - name: Run clang-tidy
#     uses: ai-warevo/<repo>/.github/actions/clang-tidy@6cae36f7fe728c23b1a6170d09d6dace55edea77
#     with:
#       source_dir: .
#       build_dir: build
#       checks: 'bugprone-*,modernize-*'
#       header_filter: .*/include/aw/tpl/.*
#       exclude: _deps,build

name: 'Clang-Tidy Lint'
description: 'Run clang-tidy on C++ source and header files, fail on any warnings'

inputs:
  source_dir:
    description: 'Source directory to scan (relative to workspace)'
    required: false
    default: '.'
  build_dir:
    description: 'CMake build directory containing compile_commands.json'
    required: false
    default: 'build'
  checks:
    description: 'clang-tidy check patterns (comma-separated)'
    required: false
    default: >-
      *,
      bugprone-*,
      cppcoreguidelines-avoid-capturing-lambda-coroutines,
      cppcoreguidelines-avoid-reference-coroutine-parameters,
      cppcoreguidelines-missing-std-forward,
      cppcoreguidelines-slicing,
      misc-const-correctness,
      misc-definitions-in-headers,
      misc-unused-using-decls,
      modernize-use-nodiscard,
      modernize-use-override,
      modernize-use-using,
      performance-*,
      readability-container-size-empty,
      readability-redundant-member-init,
      -bugprone-easily-swappable-parameters,
      -bugprone-exception-escape,
      -bugprone-unchecked-optional-access
  header_filter:
    description: 'Regex for headers to include in diagnostics'
    required: false
    default: '.*/include/.*|.*/src/.*'
  exclude:
    description: 'Directory names or file names to exclude from compile database paths (comma-separated)'
    required: false
    default: '_deps,build,CMakeFiles,cmake'
  fail_on_error:
    description: 'Whether non-zero exit code fails the step (default: true)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run clang-tidy
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        BUILD_DIR: ${{ inputs.build_dir }}
        CHECKS: ${{ inputs.checks }}
        HEADER_FILTER: ${{ inputs.header_filter }}
        EXCLUDE: ${{ inputs.exclude }}
        FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
      run: |
        set -euo pipefail

        BUILD_PATH="${SOURCE_DIR}/${BUILD_DIR}"
        if [ ! -f "${BUILD_PATH}/compile_commands.json" ]; then
          echo "::error::compile_commands.json not found at ${BUILD_PATH}/compile_commands.json"
          echo "Run cmake with CMAKE_EXPORT_COMPILE_COMMANDS=ON first."
          exit 1
        fi

        # Parse checks: allow multi-line YAML lists (join with comma)
        CHECKS_CLEAN=$(echo "$CHECKS" | tr '\n' ',' | sed 's/,,*/,/g; s/^[[:space:]]*//; s/[[:space:]]*$//')

        # If a .clang-tidy config file exists, let it control the checks
        # (command-line --checks overrides config file settings).
        # Check at source_dir first, then at the workspace root.
        CONFIG_FILE="${SOURCE_DIR}/.clang-tidy"
        if [ ! -f "$CONFIG_FILE" ]; then
          CONFIG_FILE="${GITHUB_WORKSPACE}/.clang-tidy"
        fi
        if [ -f "$CONFIG_FILE" ]; then
          echo "Found $CONFIG_FILE — using config file for check selection"
          CHECKS_FLAG=""
        else
          echo "No $CONFIG_FILE found — using default checks"
          CHECKS_FLAG="--checks=$CHECKS_CLEAN"
        fi

        # Read only translation units configured for this build.
        SOURCE_PATH=$(realpath "$SOURCE_DIR")
        EXCLUDE_NAMES=()
        IFS=',' read -ra EXCLUDE_LIST <<< "$EXCLUDE"
        for exc in "${EXCLUDE_LIST[@]}"; do
          exc=$(echo "$exc" | xargs)
          if [ -n "$exc" ]; then
            EXCLUDE_NAMES+=("$exc")
          fi
        done

        ERRORS=0
        WARNINGS=""
        while IFS= read -r file; do
          if [[ "$file" != "$SOURCE_PATH"/* || ! -f "$file" ]]; then
            continue
          fi

          relative_file=${file#"$SOURCE_PATH"/}
          excluded=false
          
          # Check if filename matches exclude pattern
          filename=$(basename "$file")
          for exc in "${EXCLUDE_NAMES[@]}"; do
            if [ "$filename" = "$exc" ]; then
              excluded=true
              break
            fi
          done
          
          # Check if any directory component matches exclude pattern
          if [ "$excluded" = false ]; then
            IFS='/' read -ra path_parts <<< "$relative_file"
            for part in "${path_parts[@]::${#path_parts[@]}-1}"; do
              for exc in "${EXCLUDE_NAMES[@]}"; do
                if [ "$part" = "$exc" ]; then
                  excluded=true
                  break 2
                fi
              done
            done
          fi
          
          [ "$excluded" = true ] && continue

          if ! clang-tidy "$file" \
            -p "$BUILD_PATH" \
            $CHECKS_FLAG \
            --header-filter="$HEADER_FILTER" \
            --warnings-as-errors='*' \
            --format-style=file 2>&1; then
            ERRORS=$((ERRORS + 1))
            WARNINGS="$WARNINGS  - $file\n"
            if [ "$FAIL_ON_ERROR" = "true" ]; then
              echo "::error::clang-tidy reported issues in $file"
              exit 1
            fi
          fi
        done < <(python3 -c 'import json, sys; [print((entry["file"] if entry["file"].startswith("/") else entry["directory"] + "/" + entry["file"])) for entry in json.load(open(sys.argv[1])) if "_deps" not in entry.get("file", "") and "_deps" not in entry.get("directory", "") and "build" not in entry.get("directory", "")]' "${BUILD_PATH}/compile_commands.json")

        if [ "$ERRORS" -gt 0 ]; then
          echo -e "clang-tidy found issues in $ERRORS file(s):\n$WARNINGS"
        else
          echo "clang-tidy passed: all files clean"
        fi
