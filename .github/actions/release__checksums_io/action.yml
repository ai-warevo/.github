name: 'release__checksums_io'
description: 'IO action: computes SHA256 file hashes, writes or verifies SHA256SUMS.txt on disk'

inputs:
  mode:
    description: "'generate' | 'verify'"
    required: true
  artifacts_dir:
    description: 'Directory containing release files'
    required: true
  checksums_file:
    description: 'Checksums filename'
    required: false
    default: 'SHA256SUMS.txt'

outputs:
  checksums_file:
    value: ${{ steps.finalize.outputs.checksums_file }}
    description: 'Checksums filename'
  file_count:
    value: ${{ steps.finalize.outputs.file_count }}
    description: 'Number of files processed'

runs:
  using: 'composite'
  steps:
    - id: compute
      shell: python
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        CHECKSUMS_FILE: ${{ inputs.checksums_file }}
      run: |
        import os
        import json
        import hashlib

        artifacts_dir = os.environ["ARTIFACTS_DIR"]
        checksums_file = os.environ["CHECKSUMS_FILE"]
        hashes = {}

        for entry in sorted(os.listdir(artifacts_dir)):
            full_path = os.path.join(artifacts_dir, entry)
            if os.path.isfile(full_path) and entry != checksums_file:
                with open(full_path, "rb") as f:
                    hashes[entry] = hashlib.sha256(f.read()).hexdigest()

        json_str = json.dumps(hashes, ensure_ascii=False)

        if gh_out := os.environ.get("GITHUB_OUTPUT"):
            with open(gh_out, "a", encoding="utf-8") as f:
                f.write(f"hashes_json={json_str}\n")
                f.write(f"file_count={len(hashes)}\n")

    - id: read_manifest
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        CHECKSUMS_FILE: ${{ inputs.checksums_file }}
        MODE: ${{ inputs.mode }}
      run: |
        MANIFEST_TEXT=""
        if [ "$MODE" = "verify" ]; then
          MANIFEST_PATH="$ARTIFACTS_DIR/$CHECKSUMS_FILE"
          if [ -f "$MANIFEST_PATH" ]; then
            MANIFEST_TEXT=$(cat "$MANIFEST_PATH")
          fi
        fi
        echo "MANIFEST_TEXT<<EOF" >> $GITHUB_OUTPUT
        echo "$MANIFEST_TEXT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - id: pure
      uses: ai-warevo/.github/.github/actions/release__checksums_pure@main
      with:
        mode: ${{ inputs.mode }}
        hashes_json: ${{ steps.compute.outputs.hashes_json }}
        manifest_text: ${{ steps.read_manifest.outputs.MANIFEST_TEXT }}

    - id: finalize
      shell: python
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        CHECKSUMS_FILE: ${{ inputs.checksums_file }}
        MODE: ${{ inputs.mode }}
        FILE_COUNT: ${{ steps.compute.outputs.file_count }}
        JSON_OUTPUT: ${{ steps.pure.outputs.json_output }}
      run: |
        import os
        import json
        import sys

        artifacts_dir = os.environ["ARTIFACTS_DIR"]
        checksums_file = os.environ["CHECKSUMS_FILE"]
        mode = os.environ["MODE"]
        file_count = int(os.environ["FILE_COUNT"])
        json_output = json.loads(os.environ["JSON_OUTPUT"])

        if mode == "generate":
            manifest = json_output["manifest"]
            checksums_path = os.path.join(artifacts_dir, checksums_file)

            if file_count > 0:
                with open(checksums_path, "w", encoding="utf-8") as f:
                    f.write(manifest)
                print(f"Generated {file_count} checksums")
            else:
                open(checksums_path, "w").close()
                print(f"No files found; created empty {checksums_file}")

            if gh_out := os.environ.get("GITHUB_OUTPUT"):
                with open(gh_out, "a", encoding="utf-8") as f:
                    f.write(f"checksums_file={checksums_file}\n")
                    f.write(f"file_count={file_count}\n")

        elif mode == "verify":
            valid = json_output["valid"]
            errors = json_output["errors"]

            if gh_out := os.environ.get("GITHUB_OUTPUT"):
                with open(gh_out, "a", encoding="utf-8") as f:
                    f.write(f"checksums_file={checksums_file}\n")
                    f.write(f"file_count={file_count}\n")

            if valid:
                print("✅ Checksums verified successfully")
            else:
                print("::error::Checksum verification failed:", file=sys.stderr)
                for error in errors:
                    print(f"::error::  {error}", file=sys.stderr)
                sys.exit(1)
