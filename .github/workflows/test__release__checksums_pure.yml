name: test__release__checksums_pure

on:
  workflow_call:

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Test 1: generate mode with unsorted keys → verify sorted output
      - id: test_1_generate_unsorted
        uses: ai-warevo/.github/.github/actions/release__checksums_pure@main
        with:
          mode: 'generate'
          hashes_json: '{"z.bin": "zzz", "a.bin": "aaa", "m.bin": "mmm"}'
          manifest_text: ''

      - name: Verify test_1_generate_unsorted
        run: |
          json='${{ steps.test_1_generate_unsorted.outputs.json_output }}'
          file_count=$(echo "$json" | jq '.file_count')
          manifest=$(echo "$json" | jq -r '.manifest')
          echo "Test 1: generate unsorted keys"
          [[ "$file_count" == "3" ]] || exit 1
          # Verify alphabetical order
          first_line=$(echo "$manifest" | head -1)
          [[ "$first_line" == *"a.bin"* ]] || exit 1
          last_line=$(echo "$manifest" | tail -1)
          [[ "$last_line" == *"z.bin"* ]] || exit 1
          echo "✓ Test 1 passed"

      # Test 2: generate mode with empty hashes → empty manifest
      - id: test_2_generate_empty
        uses: ai-warevo/.github/.github/actions/release__checksums_pure@main
        with:
          mode: 'generate'
          hashes_json: '{}'
          manifest_text: ''

      - name: Verify test_2_generate_empty
        run: |
          json='${{ steps.test_2_generate_empty.outputs.json_output }}'
          file_count=$(echo "$json" | jq '.file_count')
          manifest=$(echo "$json" | jq -r '.manifest')
          echo "Test 2: generate with empty hashes"
          [[ "$file_count" == "0" ]] || exit 1
          [[ -z "$manifest" ]] || exit 1
          echo "✓ Test 2 passed"

      # Test 3: verify mode with matching manifest and hashes
      - id: test_3_verify_matching
        uses: ai-warevo/.github/.github/actions/release__checksums_pure@main
        with:
          mode: 'verify'
          hashes_json: '{"file1.txt": "abc123", "file2.txt": "def456"}'
          manifest_text: "abc123  file1.txt\ndef456  file2.txt"

      - name: Verify test_3_verify_matching
        run: |
          json='${{ steps.test_3_verify_matching.outputs.json_output }}'
          valid=$(echo "$json" | jq '.valid')
          checked=$(echo "$json" | jq '.checked_count')
          errors=$(echo "$json" | jq '.errors | length')
          echo "Test 3: verify with matching hashes"
          [[ "$valid" == "true" ]] || exit 1
          [[ "$checked" == "2" ]] || exit 1
          [[ "$errors" == "0" ]] || exit 1
          echo "✓ Test 3 passed"

      # Test 4: verify mode with mismatched hash
      - id: test_4_verify_mismatch
        uses: ai-warevo/.github/.github/actions/release__checksums_pure@main
        with:
          mode: 'verify'
          hashes_json: '{"file.txt": "actual_hash_123"}'
          manifest_text: "wrong_hash_xyz  file.txt"

      - name: Verify test_4_verify_mismatch
        run: |
          json='${{ steps.test_4_verify_mismatch.outputs.json_output }}'
          valid=$(echo "$json" | jq '.valid')
          errors=$(echo "$json" | jq -r '.errors[]')
          echo "Test 4: verify with mismatched hash"
          [[ "$valid" == "false" ]] || exit 1
          echo "$errors" | grep -q "hash mismatch" || exit 1
          echo "✓ Test 4 passed"

      # Test 5: verify mode with missing file in hashes
      - id: test_5_verify_missing
        uses: ai-warevo/.github/.github/actions/release__checksums_pure@main
        with:
          mode: 'verify'
          hashes_json: '{"other.txt": "hash123"}'
          manifest_text: "abc123  missing.txt"

      - name: Verify test_5_verify_missing
        run: |
          json='${{ steps.test_5_verify_missing.outputs.json_output }}'
          valid=$(echo "$json" | jq '.valid')
          errors=$(echo "$json" | jq -r '.errors[]')
          echo "Test 5: verify with missing file in hashes"
          [[ "$valid" == "false" ]] || exit 1
          echo "$errors" | grep -q "not found in hashes_json" || exit 1
          echo "✓ Test 5 passed"

      # Test 6: verify mode with extra file in hashes (not in manifest)
      - id: test_6_verify_extra
        uses: ai-warevo/.github/.github/actions/release__checksums_pure@main
        with:
          mode: 'verify'
          hashes_json: '{"file1.txt": "abc123", "file2.txt": "def456"}'
          manifest_text: "abc123  file1.txt"

      - name: Verify test_6_verify_extra
        run: |
          json='${{ steps.test_6_verify_extra.outputs.json_output }}'
          valid=$(echo "$json" | jq '.valid')
          errors=$(echo "$json" | jq -r '.errors[]')
          echo "Test 6: verify with extra file in hashes"
          [[ "$valid" == "false" ]] || exit 1
          echo "$errors" | grep -q "missing from manifest" || exit 1
          echo "✓ Test 6 passed"

      # Summary
      - name: Test Summary
        if: always()
        run: |
          echo "====== PURE CHECKSUMS TEST SUMMARY ======"
          echo "✓ All 6 test cases executed"
          echo "✓ generate mode: sorted keys, empty handling"
          echo "✓ verify mode: matching, mismatched, missing, extra"
          echo "✓ Zero file I/O — all tests in-memory"
          echo "=========================================="
