# Run the selected composite-action test workflows.
name: actions-test

on:
  workflow_dispatch:
    inputs:
      actions:
        description: Comma-separated action names (empty runs all)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  badge:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',badge,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-badge.yml@main
  release-version:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',release-version,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-release-version.yml@main
  changelog-generate:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',changelog-generate,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-changelog-generate.yml@main
    permissions:
      contents: write
  changelog-promote:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',changelog-promote,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-changelog-promote.yml@main
    permissions:
      contents: write
  changelog-release:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',changelog-release,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-changelog-release.yml@main
  checksums:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',checksums,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-checksums.yml@main
  checksums-verify:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',checksums-verify,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-checksums-verify.yml@main
  coverage-parser:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',coverage-parser,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-coverage-parser.yml@main
  badge-deploy:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',badge-deploy,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-badge-deploy.yml@main
    permissions:
      contents: write
  coverage-html-deploy:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',coverage-html-deploy,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-coverage-html-deploy.yml@main
    permissions:
      contents: write
  docker-save:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',docker-save,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-docker-save.yml@main
  docker-build-push:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',docker-build-push,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-docker-build-push.yml@main
  docker-push-ghcr:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',docker-push-ghcr,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-docker-push-ghcr.yml@main
    permissions:
      contents: read
      packages: write
  download-artifacts:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',download-artifacts,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-download-artifacts.yml@main
    permissions:
      contents: read
      actions: read
  collect-release-assets:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',collect-release-assets,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-collect-release-assets.yml@main
    permissions:
      contents: read
      actions: read
  cmake-build:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',cmake-build,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-cmake-build.yml@main
  ctest-run:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',ctest-run,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-ctest-run.yml@main
  gcovr-report:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',gcovr-report,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-gcovr-report.yml@main
  clang-format:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',clang-format,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-clang-format.yml@main
  clang-tidy:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',clang-tidy,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-clang-tidy.yml@main
  setup-toolchain:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',setup-toolchain,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-setup-toolchain.yml@main
  windows-code-sign:
    if: ${{ inputs.actions == '' || contains(format(',{0},', inputs.actions), ',windows-code-sign,') }}
    uses: ai-warevo/.github/.github/workflows/action-test-windows-code-sign.yml@main
