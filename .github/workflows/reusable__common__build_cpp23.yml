name: reusable__common__build_cpp23

on:
  workflow_call:
    inputs:
      upload_artifacts:
        type: boolean
        required: true
        default: false
        description: 'Whether to upload build artifacts'
      artifacts_base_path:
        type: string
        required: false
        default: 'dist'
        description: 'Base directory where build artifacts are located (relative to repo root). Preset name is appended automatically: <artifacts_base_path>/<preset>/'
      new_version_number:
        type: string
        required: false
        default: '0.0.1'
        description: 'Version number to assign to the build'
      lint_cmd:
        type: string
        required: false
        default: 'make lint'
        description: 'Command to run code linting and style checks'
      build_cmd:
        type: string
        required: false
        default: 'make build'
        description: 'Command to build the project'
      test_cmd:
        type: string
        required: false
        default: 'make test'
        description: 'Command to run the test suite'
      version_file_path:
        type: string
        required: false
        default: 'VERSION'
        description: 'Path to the version file to set for the build'
      enable_code_signing:
        type: boolean
        required: false
        default: false
        description: 'Import code signing certificate before build (Windows release only)'
      code_sign_presets:
        type: string
        required: false
        default: 'msvc-release'
        description: 'Comma-separated list of presets that get code signing (e.g. "msvc-release" or "msvc-release,other")'

    secrets:
      code_sign_certificate_base64:
        description: 'Base64-encoded PFX certificate for code signing'
        required: false
      code_sign_certificate_password:
        description: 'Password to unlock the PFX certificate'
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    container: ghcr.io/ai-warevo/ci-cpp23:clang-18-libcxx
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: lint
        shell: bash
        run: ${{ inputs.lint_cmd }}

  build:
    name: Build (${{ matrix.preset }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: gcc-15-debug
            os: ubuntu-24.04
            container: ghcr.io/ai-warevo/ci-cpp23:gcc-15
          - preset: gcc-15-release
            os: ubuntu-24.04
            container: ghcr.io/ai-warevo/ci-cpp23:gcc-15
          - preset: clang18-libcxx-debug
            os: ubuntu-24.04
            container: ghcr.io/ai-warevo/ci-cpp23:clang-18-libcxx
          - preset: clang18-libcxx-release
            os: ubuntu-24.04
            container: ghcr.io/ai-warevo/ci-cpp23:clang-18-libcxx
          - preset: clang18-libstdcxx-debug
            os: ubuntu-24.04
            container: ghcr.io/ai-warevo/ci-cpp23:clang-18-libstdc
          - preset: clang18-libstdcxx-release
            os: ubuntu-24.04
            container: ghcr.io/ai-warevo/ci-cpp23:clang-18-libstdc
          - preset: msvc-debug
            os: windows-latest
            container: ''
          - preset: msvc-release
            os: windows-latest
            container: ''

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      PRESET: ${{ matrix.preset }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        if: inputs.version_file_path != ''
        shell: bash
        run: echo "${{ inputs.new_version_number }}" > "${{ inputs.version_file_path }}"

      - name: Setup MSVC
        if: startsWith(matrix.preset, 'msvc')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Import code signing certificate
        if: inputs.enable_code_signing && contains(inputs.code_sign_presets, matrix.preset)
        uses: ai-warevo/.github/.github/actions/common__setup_code_sign_io@main
        with:
          certificate_base64: ${{ secrets.code_sign_certificate_base64 }}
          certificate_password: ${{ secrets.code_sign_certificate_password }}

      - name: build
        timeout-minutes: 60
        shell: bash
        run: ${{ inputs.build_cmd }}

      - name: test
        timeout-minutes: 15
        shell: bash
        run: ${{ inputs.test_cmd }}

      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifacts
        with:
          name: common__build_${{ matrix.preset }}
          path: ${{ inputs.artifacts_base_path }}/${{ matrix.preset }}/
