# reusable-matrix — cross-platform build + test matrix
#
# Reusable workflow (workflow_call).
# Consumers call via:
#   uses: ai-warevo/.github/.github/workflows/reusable-matrix.yml@main
#
# Parameters:
#   source_dir          — source directory (default: .)
#   build_dir           — build directory (default: build)
#   build_types         — JSON array of build types (default: ["Debug", "Release"])
#   enable_windows      — Enable Windows MSVC builds (default: true)
#   cmake_extra_args_linux   — Extra CMake args for Linux builds (default: empty)
#   cmake_extra_args_windows — Extra CMake args for Windows builds (default: empty)
#   ctest_timeout       — CTest timeout in seconds (default: 120)
#   post_build_command  — Optional command to run after tests (default: empty)
#   setup_command       — Optional Bash command to prepare the source tree after checkout
#
# Linux builds across: gcc-15, clang-18-libstdc, clang-18-libcxx (always hardcoded)

name: reusable-matrix

on:
  workflow_call:
    inputs:
      source_dir:
        description: 'Source directory'
        type: string
        default: '.'
      build_dir:
        description: 'Build directory'
        type: string
        default: build
      build_types:
        description: 'JSON array of build types (e.g., ["Debug", "Release"])'
        type: string
        default: '["Debug", "Release"]'
      enable_windows:
        description: 'Enable Windows MSVC builds'
        type: boolean
        default: true
      cmake_extra_args_linux:
        description: 'Extra CMake args for Linux builds'
        type: string
        default: ''
      cmake_extra_args_windows:
        description: 'Extra CMake args for Windows builds'
        type: string
        default: ''
      ctest_timeout:
        description: 'CTest timeout in seconds'
        type: number
        default: 120
      post_build_command:
        description: 'Optional command to run after tests'
        type: string
        default: ''
      setup_command:
        description: 'Optional Bash command to prepare the source tree after checkout'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-test-linux:
    name: ${{ matrix.image }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(inputs.build_types) }}
        include:
          - image: ghcr.io/ai-warevo/cpp23:gcc-15
            cmake_args: -GNinja -DCMAKE_CXX_COMPILER=g++-15
          - image: ghcr.io/ai-warevo/cpp23:clang-18-libstdc
            cmake_args: -GNinja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS=-stdlib=libstdc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libstdc++ -DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libstdc++
          - image: ghcr.io/ai-warevo/cpp23:clang-18-libcxx
            cmake_args: -GNinja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fexperimental-library" -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libc++

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare source tree
        if: inputs.setup_command != ''
        shell: bash
        env:
          PREPARE_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: ${{ matrix.build_type }}
          extra_args: >-
            ${{ matrix.cmake_args }}
            ${{ inputs.cmake_extra_args_linux }}

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          config: ${{ matrix.build_type }}
          output_on_failure: true
          timeout: ${{ inputs.ctest_timeout }}

      - name: Post-build command
        if: inputs.post_build_command != ''
        working-directory: ${{ inputs.source_dir }}
        run: ${{ inputs.post_build_command }}

  build-test-windows:
    name: Windows MSVC / ${{ matrix.build_type }}
    if: inputs.enable_windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(inputs.build_types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare source tree
        if: inputs.setup_command != ''
        shell: bash
        env:
          PREPARE_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: ${{ matrix.build_type }}
          config: ${{ matrix.build_type }}
          extra_args: ${{ inputs.cmake_extra_args_windows }}

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          config: ${{ matrix.build_type }}
          output_on_failure: true
          timeout: ${{ inputs.ctest_timeout }}

      - name: Post-build command (Windows)
        if: inputs.post_build_command != ''
        working-directory: ${{ inputs.source_dir }}
        shell: pwsh
        run: ${{ inputs.post_build_command }}
