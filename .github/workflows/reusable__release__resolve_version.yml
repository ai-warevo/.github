name: reusable__release__resolve_version

on:
  workflow_call:
    inputs:
      version_source:
        type: string
        required: false
        default: 'version_file'
        description: 'Where to read version from: git_tags, version_file, package_json, cargo_toml'
      version_file_path:
        type: string
        required: false
        default: 'VERSION'
        description: 'Path to version file (for version_file source)'
    outputs:
      version:
        value: ${{ jobs.resolve.outputs.version }}
      release_notes:
        value: ${{ jobs.resolve.outputs.release_notes }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_notes: ${{ steps.resolve.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        uses: ai-warevo/.github/.github/actions/release__resolve_next_release_io@main
        with:
          version_source: ${{ inputs.version_source }}
          version_file_path: ${{ inputs.version_file_path }}
