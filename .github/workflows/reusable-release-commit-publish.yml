# reusable-release-commit-publish — commit/tag and publish GitHub Release

name: reusable-release-commit-publish

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (X.Y.Z, without v prefix)'
        type: string
        required: true
      artifact_name:
        description: 'Artifact name to attach to release (empty = no artifacts)'
        type: string
        default: ''
      artifact_directory:
        description: 'Directory where artifacts are downloaded'
        type: string
        default: artifacts
      what-included:
        description: 'What''s Included section for release notes'
        type: string
        default: ''
      quick-start:
        description: 'Quick Start section for release notes'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  commit-tag:
    name: Commit and tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download generated changelog
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-changelog
          path: .

      - name: Promote changelog
        if: github.event_name == 'workflow_dispatch'
        uses: ai-warevo/.github/.github/actions/changelog-promote@main
        with:
          version: ${{ inputs.version }}

      - name: Update VERSION file
        run: echo "${{ inputs.version }}" > VERSION

      - name: Commit and tag
        uses: ai-warevo/.github/.github/actions/release-commit-tag@main
        with:
          version: v${{ inputs.version }}
          branch: ${{ github.ref_name }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: commit-tag
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download release artifacts
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_directory }}

      - name: Generate checksums
        if: inputs.artifact_name != ''
        uses: ai-warevo/.github/.github/actions/checksums@main
        with:
          artifacts_dir: ${{ inputs.artifact_directory }}
          checksums_file: SHA256SUMS.txt

      - name: Verify checksums
        if: inputs.artifact_name != ''
        uses: ai-warevo/.github/.github/actions/checksums-verify@main
        with:
          artifacts_dir: ${{ inputs.artifact_directory }}
          checksums_file: SHA256SUMS.txt

      - name: Generate Release Notes
        id: changelog
        uses: ai-warevo/.github/.github/actions/changelog-release@main
        with:
          tag: v${{ inputs.version }}
          what-included: ${{ inputs.what-included }}
          quick-start: ${{ inputs.quick-start }}

      - name: Create Release with artifacts
        if: inputs.artifact_name != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            ${{ inputs.artifact_directory }}/**
          generate_release_notes: false

      - name: Create Release
        if: inputs.artifact_name == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          generate_release_notes: false
