# reusable-release-resolve — resolve version and generate changelog

name: reusable-release-resolve

on:
  workflow_call:
    inputs:
      version:
        description: 'Version ("auto" or X.Y.Z)'
        type: string
        default: 'auto'
    outputs:
      release_version:
        description: 'Full version with v prefix'
        value: ${{ jobs.resolve.outputs.release_version }}
      release_version_stripped:
        description: 'Version without v prefix'
        value: ${{ jobs.resolve.outputs.release_version_stripped }}

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_version_stripped: ${{ steps.version.outputs.release_version_stripped }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        uses: ai-warevo/.github/.github/actions/changelog-generate@main
        with:
          force: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Resolve version
        id: version
        uses: ai-warevo/.github/.github/actions/release-version@main
        with:
          version: ${{ inputs.version }}

      - name: Upload generated changelog
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-changelog
          path: CHANGELOG.md
          if-no-files-found: error
