name: on_push__main

on:
  push:
    branches:
      - main
    paths:
      - 'example/**'
      - 'examples/**'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Makefile'
      - '.editorconfig'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ai-warevo/.github/.github/workflows/reusable__common__build_cpp23.yml@main
    with:
      upload_artifacts: false
      lint_cmd: 'cd example && make lint'
      build_cmd: 'cd example && make build'
      test_cmd: 'cd example && make test'
      version_file_path: ''

  coverage:
    uses: ai-warevo/.github/.github/workflows/reusable__common__coverage_cpp23.yml@main
    with:
      coverage_cmd: 'cd example && make coverage PRESET=gcc-15-coverage'
      coverage_artifacts_path: |
        example/coverage.xml
        example/htmlcov/
      coverage_xml_path: coverage.xml
      coverage_html_path: htmlcov
      min_coverage: 0
      deploy_pages: true
      deploy_badge: true
