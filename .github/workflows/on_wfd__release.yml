name: on_wfd__release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  resolve_version:
    uses: ai-warevo/.github/.github/workflows/reusable__release__resolve_version.yml@main

  build:
    needs: resolve_version
    uses: ai-warevo/.github/.github/workflows/reusable__common__build_cpp23.yml@main
    with:
      upload_artifacts: true
      new_version_number: ${{ needs.resolve_version.outputs.version }}
      version_file_path: 'VERSION'
      lint_cmd: 'cd example && make lint'
      build_cmd: 'cd example && make build'
      test_cmd: 'cd example && make test'

  sanitizers:
    needs: resolve_version
    uses: ai-warevo/.github/.github/workflows/reusable__common__sanitizers_cpp23.yml@main
    with:
      build_cmd: 'cd example && make build'
      test_cmd: 'cd example && make test'
      working_directory: .

  publish:
    needs: [resolve_version, build, sanitizers]
    uses: ai-warevo/.github/.github/workflows/reusable__release__publish.yml@main
    with:
      version: ${{ needs.resolve_version.outputs.version }}
      release_notes: ${{ needs.resolve_version.outputs.release_notes }}
      release_notes_footer: |
        ### 📦 What's Included
        - Universal CI/CD workflow templates (pr-fast.yml, weekly-deep.yml, release.yml) for Node.js, Python, C#, C++, Go, Rust, Java
        - Custom GitHub Action: SVG Badge Generator
        - AI skills: analyst, planner, executor, skill-creator, git-github-push
        - Project templates: overview, task, README, CHANGELOG, CONTRIBUTING
        - LLM server (llama.cpp) with Docker Compose and GPU support
        
        ### 🚀 Quick Start
        Add coverage badge to your README.md:
        ```md
        ![Coverage](https://raw.githubusercontent.com/your-org/your-repo/badges/coverage.svg)
        ```

