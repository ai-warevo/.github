# reusable-release-with-build — commit/tag and publish release
#
# Reusable workflow for projects where VERSION is embedded during build.
# Assumes caller has already:
#   1. Resolved version
#   2. Built with that version
#   3. Collected artifacts
#
# This workflow:
#   - Updates CHANGELOG (promotes [Unreleased] to version)
#   - Commits VERSION and CHANGELOG
#   - Creates and pushes tag
#   - Generates checksums
#   - Publishes GitHub Release with artifacts

name: reusable-release-with-build

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without v prefix (e.g., 1.2.3)'
        type: string
        required: true
      artifact_name:
        description: 'Artifact name to attach to release'
        type: string
        required: true
      artifact_directory:
        description: 'Directory where artifacts are located'
        type: string
        default: artifacts
      what-included:
        description: 'What''s Included section for release notes'
        type: string
        default: ''
      quick-start:
        description: 'Quick Start section for release notes'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  commit-tag-publish:
    name: Commit, tag, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Update VERSION file
        run: echo "${{ inputs.version }}" > VERSION
        shell: bash

      - name: Update CHANGELOG
        run: |
          version="${{ inputs.version }}"
          date=$(date +%Y-%m-%d)
          sed -i "s/^\## \[Unreleased\]/## [$version] - $date/" CHANGELOG.md
          {
            head -6 CHANGELOG.md
            echo ""
            echo "## [Unreleased]"
            tail -n +7 CHANGELOG.md
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
        shell: bash

      - name: Commit and tag
        uses: ai-warevo/.github/.github/actions/release-commit-tag@main
        with:
          version: v${{ inputs.version }}
          branch: ${{ github.ref_name }}

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_directory }}

      - name: Generate checksums
        uses: ai-warevo/.github/.github/actions/checksums@main
        with:
          artifacts_dir: ${{ inputs.artifact_directory }}
          checksums_file: SHA256SUMS.txt

      - name: Verify checksums
        uses: ai-warevo/.github/.github/actions/checksums-verify@main
        with:
          artifacts_dir: ${{ inputs.artifact_directory }}
          checksums_file: SHA256SUMS.txt

      - name: Generate Release Notes
        id: changelog
        continue-on-error: true
        uses: ai-warevo/.github/.github/actions/changelog-release@main
        with:
          tag: v${{ inputs.version }}
          what-included: ${{ inputs.what-included }}
          quick-start: ${{ inputs.quick-start }}

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            ${{ inputs.artifact_directory }}/**
          generate_release_notes: false
