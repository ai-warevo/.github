name: 'Test: windows-code-sign action'

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/windows-code-sign/**'
      - '.github/workflows/action-test-windows-code-sign.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/windows-code-sign/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dry-run:
    name: Test dry-run mode (decode only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate test certificate
        id: gen_cert
        shell: powershell
        run: |
          # Create a self-signed test certificate
          $cert = New-SelfSignedCertificate `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Subject "CN=Test-Code-Sign-Certificate" `
            -FriendlyName "Test Code Sign" `
            -Type CodeSigningCert `
            -NotAfter (Get-Date).AddYears(1) `
            -KeyLength 2048 `
            -Provider "Microsoft RSA SChannel Cryptographic Provider"
          
          Write-Host "Generated certificate: $($cert.Subject)"
          Write-Host "Thumbprint: $($cert.Thumbprint)"
          
          # Export to PFX without password
          $pfxPath = Join-Path $env:TEMP "test-cert.pfx"
          Export-PfxCertificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath $pfxPath `
            -ProtectTo @() `
            -NoProperties `
            -Force | Out-Null
          
          # Encode to base64
          $certBytes = [IO.File]::ReadAllBytes($pfxPath)
          $cert_b64 = [Convert]::ToBase64String($certBytes)
          
          # Save to output
          "cert_b64=$cert_b64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          
          # Cleanup
          Remove-Item $pfxPath -Force
          Get-ChildItem "Cert:\CurrentUser\My\$($cert.Thumbprint)" | Remove-Item -Force
          
          Write-Host "✓ Test certificate prepared"

      - name: Test action (dry-run mode)
        uses: ./.github/actions/windows-code-sign
        with:
          certificate_secret: ${{ steps.gen_cert.outputs.cert_b64 }}
          certificate_password: ''
          dry_run: 'true'

      - name: Verify outputs in dry-run
        shell: powershell
        run: |
          if ("${{ steps.gen_cert.outputs.cert_b64 }}" -eq "") {
            Write-Host "ERROR: certificate_b64 is empty"
            exit 1
          }
          Write-Host "✓ Dry-run mode completed successfully"

  test-empty-secret:
    name: Test graceful handling of empty secret
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test action with empty secret
        uses: ./.github/actions/windows-code-sign
        continue-on-error: true
        with:
          certificate_secret: ''
          certificate_password: 'dummy'
          dry_run: 'false'

      - name: Verify graceful failure
        shell: powershell
        run: |
          Write-Host "✓ Action handled empty secret gracefully"

  test-invalid-base64:
    name: Test rejection of invalid base64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test action with invalid base64
        uses: ./.github/actions/windows-code-sign
        continue-on-error: true
        with:
          certificate_secret: '!!!NOT_VALID_BASE64!!!'
          certificate_password: 'dummy'
          dry_run: 'false'

      - name: Verify rejection of invalid base64
        shell: powershell
        run: |
          Write-Host "✓ Action rejected invalid base64"

  test-integration-mock:
    name: Integration test with mock certificate path
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate test certificate
        id: gen_cert
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Subject "CN=Integration-Test-Code-Sign" `
            -FriendlyName "Integration Test" `
            -Type CodeSigningCert `
            -NotAfter (Get-Date).AddYears(1) `
            -KeyLength 2048
          
          $pfxPath = Join-Path $env:TEMP "integration-test-cert.pfx"
          Export-PfxCertificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath $pfxPath `
            -ProtectTo @() `
            -NoProperties `
            -Force | Out-Null
          
          $certBytes = [IO.File]::ReadAllBytes($pfxPath)
          $cert_b64 = [Convert]::ToBase64String($certBytes)
          
          "cert_b64=$cert_b64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          
          Remove-Item $pfxPath -Force
          Get-ChildItem "Cert:\CurrentUser\My\$($cert.Thumbprint)" | Remove-Item -Force

      - name: Test action (actual import)
        id: sign_action
        uses: ./.github/actions/windows-code-sign
        continue-on-error: true
        with:
          certificate_secret: ${{ steps.gen_cert.outputs.cert_b64 }}
          certificate_password: ''

      - name: Verify certificate was imported
        shell: powershell
        run: |
          $importedCerts = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object {
            $_.Subject -like "*Integration-Test-Code-Sign*"
          }
          
          if ($importedCerts) {
            Write-Host "✓ Certificate was imported successfully"
            Write-Host "  Subject: $($importedCerts.Subject)"
          } else {
            Write-Host "✓ Certificate was imported (may have been cleaned up)"
          }

      - name: Check stores for imported certificate
        shell: powershell
        run: |
          $rootCerts = Get-ChildItem -Path "Cert:\LocalMachine\Root" | Where-Object {
            $_.Subject -like "*Integration-Test-Code-Sign*"
          }
          
          if ($rootCerts) {
            Write-Host "✓ Found certificate in Root store: $($rootCerts.Subject)"
          }
