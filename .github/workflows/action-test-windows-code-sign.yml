name: Unit Tests - windows-code-sign

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: windows-code-sign
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test with empty secret (dry_run)
        uses: ./.github/actions/windows-code-sign
        continue-on-error: true
        with:
          certificate_secret: ''
          certificate_password: 'dummy'
          dry_run: 'true'

      - name: Test with invalid base64
        uses: ./.github/actions/windows-code-sign
        continue-on-error: true
        with:
          certificate_secret: '!!!invalid!!!'
          certificate_password: 'dummy'
          dry_run: 'true'

      - name: Done
        shell: powershell
        run: Write-Host "✓ Tests completed"
